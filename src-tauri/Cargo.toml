[package]
name = "sotyware"
version = "0.1.0"
description = "sotyware desktop runtime"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which avoids an output filename collision on Windows (rust-lang/cargo#8519).
name = "sotyware_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Already in the tree through tauri (with derive); declared to derive Serialize for
# the feature types the frontend receives (ADR-014).
serde = { version = "1", features = ["derive"] }
# Stores feature preferences (ADR-015). `bundled` compiles SQLite into the binary,
# so Windows and every Linux distribution get the same SQLite version, with no
# system library to install. No default features: the statement cache and the
# wasm backend are not needed.
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
# Cloud storage proof of concept (ADR-016): one generic S3 adapter for every
# S3-compatible provider. No default features: they would pull in aws-lc-rs (a
# CMake/NASM build on Windows) and SigV4a, which no supported provider needs.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "http-1x"] }
# The HTTPS client for aws-sdk-s3, with rustls on ring instead of aws-lc-rs:
# ring builds with the C compiler Tauri already needs on both platforms.
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
# Already in the tree through Tauri: file I/O and the per-account transfer limit.
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "sync", "rt"] }
# Already in the tree through Tauri: end-to-end SHA-256 of uploaded objects.
sha2 = "0.10"
# Cloud account credentials in the OS credential store (ADR-017): the
# platform-independent API; one platform store crate per OS below.
keyring-core = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
# Already in the dependency tree through tauri; used by tests that check
# tauri.conf.json and the capability file against the Rust constants.
serde_json = "1"
# In-process S3 server for the offline cloud storage tests (no network, no
# credentials): s3s implements the S3 protocol, s3s-fs stores objects in a
# temporary folder.
s3s = "0.12"
s3s-fs = "0.12"
# s3s 0.12 pins release candidates of the RustCrypto hashes, which build only
# against this release candidate of `digest`; without the pin Cargo picks a
# newer `digest` and the test build fails. Test-only.
digest = "=0.11.0-rc.4"
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager for keyring-core (ADR-017). No default features:
# `search` (and its regex) is not needed.
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Not used directly: enables tray-icon's pure-Rust StatusNotifierItem backend
# (ksni) on the tray-icon that Tauri already depends on. tray-icon selects ksni
# over libappindicator when both features are on, which avoids a registration
# race in libayatana-appindicator. Same version range as Tauri's, so Cargo
# unifies it with Tauri's copy instead of adding a second one.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# Not new crates either: both are in the tree through tray-icon's ksni backend.
# Declared only so tray.rs can name the error types ksni returns and tell "no
# tray host here" apart from real failures (ADR-012). No features are added.
ksni = { version = "0.3", default-features = false }
zbus = { version = "5", default-features = false }
# Secret Service for keyring-core over the zbus already in the tree (ADR-017):
# pure Rust, no libdbus/libsecret. `rt-async-io`: the zbus runtime already
# enabled; the tokio variant would switch zbus's runtime for the tray too.
# `crypto-rust`: the secret travels DH-encrypted over D-Bus.
zbus-secret-service-keyring-store = { version = "1", default-features = false, features = ["rt-async-io-crypto-rust"] }
# Already in the tree through the store above; declared only so keyring.rs
# can name its error type and tell "no Secret Service" and "locked" apart
# from other failures. No features are added.
secret-service = { version = "5", default-features = false }
