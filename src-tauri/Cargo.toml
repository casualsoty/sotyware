[package]
name = "sotyware"
version = "0.1.1"
description = "sotyware desktop runtime"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which avoids an output filename collision on Windows (rust-lang/cargo#8519).
name = "sotyware_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Already in the tree through tauri (with derive); declared to derive Serialize for
# the feature types the frontend receives (ADR-014).
serde = { version = "1", features = ["derive"] }
# Stores feature preferences (ADR-015). `bundled` compiles SQLite into the binary,
# so Windows and every Linux distribution get the same SQLite version, with no
# system library to install. No default features: the statement cache and the
# wasm backend are not needed.
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
# Cloud storage proof of concept (ADR-016): one generic S3 adapter for every
# S3-compatible provider. No default features: they would pull in aws-lc-rs (a
# CMake/NASM build on Windows) and SigV4a, which no supported provider needs.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "http-1x"] }
# The HTTPS client for aws-sdk-s3, with rustls on ring instead of aws-lc-rs:
# ring builds with the C compiler Tauri already needs on both platforms.
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
# Already in the tree through Tauri: file I/O, the per-account transfer limit,
# and (`time`) the upload stall timeout and the bounded multipart abort.
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "sync", "rt", "time"] }
# Already in the tree through aws-sdk-s3 and hyper: the `Body` trait of the
# upload request body that hashes the bytes as they are sent (ADR-021).
http-body = "1"
# Already in the tree through Tauri: end-to-end SHA-256 of uploaded objects.
sha2 = "0.10"
# Cloud account credentials in the OS credential store (ADR-017): the
# platform-independent API; one platform store crate per OS below.
keyring-core = "1"
# Already in the tree through Tauri: backup manifests and job configurations
# (ADR-031), and the recorder's JSON Lines (ADR-024).
serde_json = "1"
# The end-to-end encrypted account vault (ADR-032), RustCrypto crates only:
# XChaCha20-Poly1305 for the vault and the recovery wrap, X25519 sealed
# boxes (libsodium's crypto_box_seal construction) for device wraps, and
# HKDF-SHA256 (already in the tree) to derive keys from the recovery key.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
crypto_box = { version = "0.9", default-features = false, features = ["seal", "salsa20", "getrandom"] }
hkdf = "0.12"
zeroize = "1"
# Already in the tree through reqwest: encoding keys and ciphertext as text.
base64 = "0.23"
# The account service client (ADR-032): already in the tree through Tauri.
# rustls without a built-in provider: the TLS configuration is built with
# ring (as for aws-sdk-s3) instead of aws-lc-rs, which needs CMake/NASM.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# Only with the `request-recorder` feature (ADR-024), both already in the
# tree through aws-sdk-s3: the SDK types its interceptor reads (`Metadata`,
# `RequestAttempts`, `Storable`), which aws-sdk-s3 does not re-export.
aws-smithy-runtime-api = { version = "1", optional = true }
aws-smithy-types = { version = "1", optional = true }

[features]
# Off by default and never in a shipped build: records the app's own S3
# requests for a controlled integration run (ADR-024). build.rs refuses it
# unless the target directory is named `recorder`
# (`--target-dir target/recorder`), and scripts/check-release-binary.mjs
# refuses to package a binary that contains it.
# A recorder build is always a test-profile build too (ADR-027).
request-recorder = ["test-profile", "dep:aws-smithy-runtime-api", "dep:aws-smithy-types"]
# Off by default and never in a shipped build: the app refuses to start
# unless SOTYWARE_TEST_PROFILE names a test profile, and then keeps every
# database, its webview data and its credentials inside that profile, under
# its own identifier (ADR-027). For desktop tests only. build.rs refuses it
# unless the target directory is named `test-profile` or `recorder`;
# scripts/check-release-binary.mjs refuses to package such a binary.
test-profile = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# The native save dialog for cloud downloads (ADR-020), opened from Rust
# only: the frontend gets no `dialog:` permission. Adds rfd (GTK 3 on Linux,
# the common item dialog on Windows) and tauri-plugin-fs, which it requires.
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# Application updates (ADR-033), driven from Rust only (no `updater:`
# permission for the page). Only `rustls-tls` (rustls without a crypto
# provider: sotyware passes its own ring-based TLS configuration); no `zip`
# (Windows installers are served unzipped) and no `system-proxy`.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
# Verifies sotyware's signed update manifest (ADR-033) with the same
# minisign scheme the updater plugin uses for artifacts (already in the tree
# through it).
minisign-verify = "0.3"
# Already in the tree through Tauri: release versions in the update check.
semver = "1"
# Folder sync (ADR-043): recursive file change notifications in the sync
# folder (ReadDirectoryChangesW, inotify, FSEvents). Only the default
# feature, FSEvents on macOS; no channel or async integration crates.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# Folder sync's "Open folder" (ADR-043): the official opener plugin's
# `open_path`, called from Rust only. The plugin is not registered and the
# page gets no `opener:` permission.
tauri-plugin-opener = "2"

[dev-dependencies]
# Already in the dependency tree through tauri; used by tests that check
# tauri.conf.json and the capability file against the Rust constants.
serde_json = "1"
# In-process S3 server for the offline cloud storage tests (no network, no
# credentials): s3s implements the S3 protocol, s3s-fs stores objects in a
# temporary folder.
s3s = "0.12"
s3s-fs = "0.12"
# s3s 0.12 pins release candidates of the RustCrypto hashes, which build only
# against this release candidate of `digest`; without the pin Cargo picks a
# newer `digest` and the test build fails. Test-only.
digest = "=0.11.0-rc.4"
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
# Already in the tree through hyper-util, the AWS SDK and reqwest: the test
# server's per-request service, which reads the rest of a request it refused
# from its headers (412) before answering, so Windows does not drop the
# answer with a reset connection.
hyper = "1"
# Already in the tree through hyper and the AWS SDK: the request types of
# the test server's ListMultipartUploads route (s3s-fs answers 501 to it).
http = "1"
# The account service itself (server/), run in process by the end-to-end
# account and sync tests (account/tests.rs). Test-only; never in a build.
sotyware-server = { path = "../server" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# Signs test update manifests and artifacts with keys generated in the test
# (never a real key), and the mock runtime to drive the updater plugin.
minisign = "0.7"
tauri = { version = "2", features = ["tray-icon", "test"] }
# Already in the tree through s3s and the AWS SDK: the test server's object
# bodies (slow, stalled or cut-off streams) implement `Stream` over `Bytes`.
bytes = "1"
futures-core = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
# Already in the tree through aws-sdk-s3: the SDK types the request recorder's
# lifecycle assumptions are tested with (`hook_assumptions.rs`, ADR-024),
# `Metadata`, `RequestAttempts`, `Storable`, which aws-sdk-s3 does not re-export.
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager for keyring-core (ADR-017). No default features:
# `search` (and its regex) is not needed.
windows-native-keyring-store = { version = "1", default-features = false }
# Already in the tree through notify and tauri: folder sync's free space
# check (`GetDiskFreeSpaceExW`) and hiding its own folder in a sync folder
# (`SetFileAttributesW`), ADR-043.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
# Already in the tree (through async-io and others): folder sync's free
# space check (`statvfs`) without unsafe code, ADR-043.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS Keychain for keyring-core (ADR-017, ADR-037): the "legacy"
# file-based keychain every app may use, signed or not, without a
# provisioning profile or keychain-access-group entitlement (the
# data-protection keychain, `protected`, needs both). No default features.
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }
# Already in the tree through the store above; declared only so keyring.rs
# can name its error type and tell a dismissed prompt or a locked keychain
# apart from other failures by the OSStatus code. No features are added.
security-framework = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Not used directly: enables tray-icon's pure-Rust StatusNotifierItem backend
# (ksni) on the tray-icon that Tauri already depends on. tray-icon selects ksni
# over libappindicator when both features are on, which avoids a registration
# race in libayatana-appindicator. Same version range as Tauri's, so Cargo
# unifies it with Tauri's copy instead of adding a second one.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# Not new crates either: both are in the tree through tray-icon's ksni backend.
# Declared only so tray.rs can name the error types ksni returns and tell "no
# tray host here" apart from real failures (ADR-012). No features are added.
ksni = { version = "0.3", default-features = false }
zbus = { version = "5", default-features = false }
# Secret Service for keyring-core over the zbus already in the tree (ADR-017):
# pure Rust, no libdbus/libsecret. `rt-async-io`: the zbus runtime already
# enabled; the tokio variant would switch zbus's runtime for the tray too.
# `crypto-rust`: the secret travels DH-encrypted over D-Bus.
zbus-secret-service-keyring-store = { version = "1", default-features = false, features = ["rt-async-io-crypto-rust"] }
# Already in the tree through the store above; declared only so keyring.rs
# can name its error type and tell "no Secret Service" and "locked" apart
# from other failures. No features are added.
secret-service = { version = "5", default-features = false }

[patch.crates-io]
# rfd 0.17.2 (through tauri-plugin-dialog) with one function changed: the
# Windows dialogs' result paths are read as `OsString` instead of
# `String::from_utf16(..).unwrap()`, which aborted sotyware on a file name
# with an unpaired surrogate (ADR-023). Upstream 0.17.2, 0.18.0 and master
# still have the `unwrap`. Remove this once a fixed rfd is released and
# tauri-plugin-dialog accepts it. How to check and update: patches/README.md.
rfd = { path = "patches/rfd" }
