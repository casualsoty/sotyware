# Opened by the app's "Send feedback" button (src-tauri/src/feedback.rs).
name: Feedback
description: An idea, a wish or anything else you want to tell about sotyware.
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Issues are **public**: do not include personal information.
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What you like, what is missing, what gets in your way.
    validations:
      required: true
