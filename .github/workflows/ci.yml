# Headless CI on Linux and Windows; macos.yml runs the same checks on both
# Mac architectures on the same events (docs/development/testing.md#ci).
#
# The repository is public, so standard hosted runners cost nothing, but runs
# still take time and count against GitHub's concurrency limits. This
# workflow therefore:
# - runs on pull requests to main and pushes to main only (a push to any other
#   branch runs nothing, so a pull request commit is never built twice);
# - never sees a secret: pull requests from forks get a read-only token and
#   no secrets anyway, and no step here names one;
# - skips commits that change only documentation or the desktop test scripts,
#   which the headless jobs do not exercise;
# - cancels an older run of the same pull request or branch when a newer one starts;
# - runs no desktop test, builds no release binary or installer, uploads no artifact;
# - caches only npm downloads and compiled Cargo dependencies, and saves the Cargo
#   cache from main only, so pull requests reuse it without adding entries.
name: ci

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "tests/desktop/**"
      - ".github/workflows/desktop-*.yml"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "tests/desktop/**"
      - ".github/workflows/desktop-*.yml"
  workflow_dispatch:
  # release.yml runs the same checks on the tagged commit before it builds
  # anything (docs/development/release.md#publishing-a-release).
  workflow_call:

permissions:
  contents: read

# Called from release.yml, the github context (and so this group) is the
# caller's: github.workflow keeps a release run's checks apart from the
# push or pull request runs of the same ref, so neither cancels the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  headless:
    name: headless (${{ matrix.os }})
    strategy:
      # Independent results per platform: a Linux failure must not hide the
      # Windows result, or the other way round.
      fail-fast: false
      matrix:
        # Linux runs on ubuntu-22.04, the runner release.yml builds the Linux
        # packages on (glibc 2.35, docs/development/release.md#building-a-release),
        # so these checks compile against the libraries a release links to;
        # ubuntu-latest is moving to Ubuntu 26.04. Move both together: GitHub
        # removes ubuntu-22.04 on 2027-04-17, with brownouts from 2027-03-23.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 40 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build libraries for the Tauri crate (docs/development/setup.md#linux-system-packages).
      # No display server, window manager, tray host or D-Bus session: nothing here
      # starts sotyware.
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # rustup is preinstalled on the hosted images; no toolchain action needed.
      - name: Install Rust stable with rustfmt and clippy
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # rust-cache keys on the OS name ("Linux"), not its release: without
          # this a Linux run could restore dependencies (build scripts, proc
          # macros, C libraries) compiled on another Ubuntu image.
          key: ${{ runner.os == 'Linux' && matrix.os || '' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci
      - run: npm run check
      # Also produces dist/, which the Tauri crate embeds at compile time.
      - run: npm run build

      # Fails if Cargo.lock does not match Cargo.toml, so later commands cannot
      # silently resolve different versions.
      - name: cargo fetch --locked
        working-directory: src-tauri
        run: cargo fetch --locked
      # Fails if Cargo no longer builds rfd from the local patch (ADR-023):
      # Cargo only warns about an unused patch and then builds the unpatched
      # crate, which aborts sotyware on some Windows file names. Checked from
      # the resolved graph (cargo metadata), before anything is compiled.
      - name: check the rfd patch is applied
        run: npm run check:rfd-patch
      # The guard's own tests, against broken temporary copies of src-tauri.
      - name: test the rfd patch guard
        run: npm run test:rfd-patch-guard
      # The request recorder (ADR-024) stays off by default, and its
      # packaging guard keeps working.
      - name: check the request recorder is off by default
        run: npm run check:release-binary
      - name: test the release binary guard
        run: npm run test:release-binary-guard
      # The application icons' check (npm run check:icons) is part of
      # test:headless; this is its own test.
      - name: test the icon check
        run: npm run test:icons
      # The installers' icon check runs on real installers only in
      # release-build.yml; its tests use fixtures built in memory.
      - name: test the installer icon check
        run: npm run test:installer-icons
      # The update manifest tool (ADR-033) against the fixture the real
      # Tauri signer produced (no key needed) and keys made in the test.
      - name: test the update manifest tool
        run: npm run test:update-manifest
      # release.yml's signing and checking script (ADR-039), run as the
      # release jobs run it (bash, the real Tauri CLI) with throwaway keys
      # made in the test. Ubuntu only, like the release jobs.
      - name: test the release assembly script
        if: runner.os == 'Linux'
        run: npm run test:release-assemble
      # Desktop tests run in test profiles only (ADR-027): the static check
      # of the drivers is part of test:headless; these are the guards' and
      # helpers' own tests.
      - name: test the desktop isolation guard
        run: npm run test:desktop-isolation-guard
      - name: test the test-profile helpers (Python on Linux, PowerShell on Windows)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File tests/desktop/test-profile-selftest.ps1
          else
            npm run test:profile-helpers
          fi
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      # The test-profile build (ADR-027) compiles other code in lib.rs and
      # cloud/keyring.rs (its own identifier, profile paths, no normal
      # credential namespace); without this step CI never compiled it.
      # build.rs refuses the feature outside a target directory named
      # test-profile. Type-checked only; its tests run locally (testing.md).
      - name: cargo clippy (test-profile build)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --features test-profile --target-dir target/test-profile -- -D warnings

      - run: npm run test:headless

      # The test-profile (ADR-027) and request-recorder (ADR-024) unit tests.
      # build.rs puts each feature in its own target directory, so each is a
      # full extra compile; request-recorder turns test-profile on and no code
      # is compiled only without the recorder, so this one build runs both
      # suites. Linux only, to keep Windows runner time down: on Windows the
      # test-profile build is type-checked by the clippy step above.
      - name: cargo test (request-recorder build, includes test-profile)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo test --locked --features request-recorder --target-dir target/recorder

      # Disaster recovery without sotyware (ADR-031): a backup made by the
      # engine is restored by scripts/recovery/sotyware-restore.py alone
      # (Python standard library) against the in-process S3 server, byte for
      # byte. Ignored by default because it needs Python 3.
      - name: standalone recovery script (Python, against the test server)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo test --locked --lib backup::tests::the_standalone_recovery_script -- --ignored

  # The account service (ADR-032): its own crate and lock file, Linux only
  # (it is deployed on a server, not shipped with the desktop app). On the
  # headless job's Ubuntu, not ubuntu-latest, which is moving to 26.04.
  server:
    name: account service (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          # The runner image, as in the headless job's cache.
          key: ubuntu-22.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - working-directory: server
        run: cargo fmt --check
      - working-directory: server
        run: cargo clippy --all-targets --locked -- -D warnings
      - working-directory: server
        run: cargo test --locked
