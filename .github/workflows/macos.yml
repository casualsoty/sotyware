# macOS (ADR-037): builds and tests sotyware on Apple Silicon (aarch64) and
# Intel (x86_64), each natively on its own hosted runner, and optionally
# packages the .app and .dmg.
#
# Not on every push: the repository is private on GitHub Free, where macOS
# runner minutes are billed at about ten times the Linux rate
# (docs/development/testing.md#ci). It runs
# - on a pull request to main that carries the label `macos` (added, or a
#   new commit pushed while it is there): the way to validate a branch
#   before this file is on main, since GitHub starts a workflow by hand
#   only once it exists on the default branch;
# - when started by hand (Actions tab, or `gh workflow run macos.yml --ref
#   <branch>`), once this file is on main;
# - from release.yml, which calls it with `package: true`.
# A pull request run never packages or signs.
#
# What it runs: the same headless checks as ci.yml (svelte-check, Vite
# build, the rfd and release-binary guards, Vitest, cargo fmt/clippy and
# `cargo test` including the in-process S3 integration tests), plus the
# Keychain round trip against a throwaway keychain made for the run (never
# the runner user's login keychain).
#
# Packaging (`package: true`): `npm run build:release` makes sotyware.app
# and the .dmg. Signing and notarization happen only when the Apple secrets
# exist (docs/development/macos.md#signing-and-notarization); each secret is
# handed only to the step that needs it:
#   APPLE_CERTIFICATE (base64 .p12 of a "Developer ID Application"
#   certificate), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_API_ISSUER, APPLE_API_KEY_ID, APPLE_API_KEY (the .p8 contents).
# They are repository secrets: started by hand this workflow reads them by
# name; release.yml passes exactly these six (declared below), never the
# update signing key or the release token. Without them the build is an
# unsigned development build and says so in the uploaded
# `macos-<arch>/status.txt`; release.yml then leaves macOS out of the
# release and of latest.json, so an unsigned Mac build is never published.
#
# No secret is needed for the tests: `gh workflow run macos.yml --ref
# <branch>` validates both architectures without any Apple account.
name: macos

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      package:
        description: "Also build sotyware.app and the .dmg (signed and notarized when the Apple secrets exist)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_KEY:
        required: false

permissions:
  contents: read

# A newer commit or label on the same pull request replaces the older run;
# a release's call is never cancelled by anything else.
concurrency:
  group: macos-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    # Pull requests only with the `macos` label (and only when that label
    # is what was added, or the code changed).
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'macos') &&
       (github.event.action != 'labeled' || github.event.label.name == 'macos'))
    strategy:
      # Each architecture's result on its own.
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            # Apple Silicon.
            runner: macos-15
            label: aarch64
          - arch: x86_64
            # Intel; GitHub's last Intel macOS image.
            runner: macos-15-intel
            label: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable with rustfmt and clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version && cargo --version && uname -m && sw_vers

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: cargo fetch --locked
        working-directory: src-tauri
        run: cargo fetch --locked
      - name: check the rfd patch is applied
        run: npm run check:rfd-patch
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo clippy (test-profile build)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --features test-profile --target-dir target/test-profile -- -D warnings

      # Guards, frontend tests and every Rust unit and in-process
      # integration test (S3 server, updater on the mock runtime, account
      # service).
      - run: npm run test:headless

      # The OS credential store for real: one entry written, read, replaced
      # and deleted in a keychain made for this run, set as the default so
      # the user's login keychain is never touched.
      - name: Keychain round trip (throwaway keychain)
        working-directory: src-tauri
        run: |
          set -eu
          kc="$RUNNER_TEMP/sotyware-ci.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$pw" "$kc"
          old_default="$(security default-keychain -d user | tr -d ' "')"
          security default-keychain -d user -s "$kc"
          trap 'security default-keychain -d user -s "$old_default"; security delete-keychain "$kc"' EXIT
          cargo test --locked --lib cloud::keyring::os_backend::round_trip -- --ignored --exact

      # Signing, only with the secrets: the certificate is imported as
      # non-extractable into a keychain made for this run, before the build,
      # so Tauri signs sotyware.app (hardened runtime, timestamp) before it
      # puts it into the .dmg. The build step gets only the identity's name.
      - name: Prepare the signing keychain (Developer ID)
        id: sign
        if: ${{ inputs.package }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eu
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Apple signing secrets: this is an unsigned development build."
            exit 0
          fi
          kc="$RUNNER_TEMP/sotyware-sign.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -x -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -q "$APPLE_SIGNING_IDENTITY"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build sotyware.app and the .dmg
        if: ${{ inputs.package }}
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eu
          if [ "$SIGNED" = "true" ]; then export APPLE_SIGNING_IDENTITY="$IDENTITY"; fi
          npm run build:release

      - name: Check the packaged app (no test build, no build-machine path, signature)
        if: ${{ inputs.package }}
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eu
          app=src-tauri/target/release/bundle/macos/sotyware.app
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          test -d "$app" && test -f "$dmg"
          node scripts/check-release-binary.mjs --local-paths "$app/Contents/MacOS/sotyware"
          lipo -archs "$app/Contents/MacOS/sotyware"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :LSMinimumSystemVersion' -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          if [ "$SIGNED" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=2 "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags"
            # The app inside the .dmg must be the signed one.
            mnt="$RUNNER_TEMP/dmg-mount"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
            codesign --verify --deep --strict "$mnt/sotyware.app"
            hdiutil detach "$mnt" > /dev/null
            codesign --verify "$dmg" 2>/dev/null || codesign --force --timestamp --sign "$IDENTITY" "$dmg"
            codesign --verify --verbose=2 "$dmg"
          else
            codesign --display --verbose=2 "$app" 2>&1 | head -5 || true
          fi

      - name: Notarize and staple
        id: notarize
        if: ${{ inputs.package && steps.sign.outputs.signed == 'true' }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -eu
          if [ -z "${APPLE_API_ISSUER:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ] || [ -z "${APPLE_API_KEY:-}" ]; then
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "No notarization secrets: signed but not notarized."
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          app=src-tauri/target/release/bundle/macos/sotyware.app
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/sotyware-app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/sotyware-app.zip" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$app"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      # The updater's package: the .app as a gzip tar whose first path
      # component is sotyware.app (what tauri-plugin-updater unpacks), named
      # with version and architecture so the two Macs' files differ.
      - name: Collect the release files
        if: ${{ inputs.package }}
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          out="$RUNNER_TEMP/macos-${{ matrix.arch }}"
          mkdir -p "$out"
          COPYFILE_DISABLE=1 tar -czf "$out/sotyware_${version}_${{ matrix.label }}.app.tar.gz" -C src-tauri/target/release/bundle/macos sotyware.app
          cp src-tauri/target/release/bundle/dmg/*.dmg "$out/"
          {
            echo "arch=${{ matrix.arch }}"
            echo "signed=${{ steps.sign.outputs.signed || 'false' }}"
            echo "notarized=${{ steps.notarize.outputs.notarized || 'false' }}"
          } > "$out/status.txt"
          ls -l "$out"; cat "$out/status.txt"
          shasum -a 256 "$out"/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.package }}
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
