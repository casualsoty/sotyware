# Publishes a sotyware release (ADR-036, ADR-038,
# docs/development/release.md#publishing-a-release).
#
# Two repositories. This one, the source repository, stays private: it
# builds, tests and signs. The public release repository named in
# src-tauri/src/updates.rs (`release_repository!`, today
# casualsoty/sotyware-releases) receives only distribution files: the
# installers, their minisign signatures, latest.json, latest.json.sig and
# SHA256SUMS. Installations fetch
#   https://github.com/<release repository>/releases/latest/download/latest.json
# anonymously; GitHub would serve a private repository's assets only to
# signed-in clients. Nothing here pushes code to the release repository.
#
#   git tag -s v0.2.0 -m "sotyware 0.2.0" -m "<release notes>" && git push origin v0.2.0
#
# or, for a tag that exists, `gh workflow run release.yml --ref v0.2.0`
# (run on the tag itself: every job builds the commit the workflow runs
# on). Started by hand it defaults to `dry_run`: it builds, signs and checks
# everything but creates no release; the files are a workflow artifact.
#
# Order, and what stops it:
#  1. prepare  - the tag is vX.Y.Z and equals the version in package.json,
#                package-lock.json, Cargo.toml, Cargo.lock and
#                tauri.conf.json; the release repository is not this one,
#                is public and holds no source code; the committed public
#                key (src-tauri/update-key.pub) is a real key, not a test
#                fixture's, and matches the signing secret. Outside a dry
#                run also: the tagged commit is on main, the release token
#                exists, the release does not exist yet, and unsigned
#                Windows installers were explicitly allowed.
#  2. ci       - ci.yml on the tagged commit (Linux and Windows).
#  3. builds   - Windows installers (release-build.yml: MSI + NSIS, checked
#                and unpacked), Linux (AppImage, deb, rpm on Ubuntu 22.04),
#                macOS aarch64 and x86_64 (macos.yml: .app, .dmg, signed
#                and notarized when the Apple secrets exist).
#  4. publish  - the only job with the update signing key and the release
#                token, each given only to the steps that need it: signs
#                every updater artifact with `tauri signer sign
#                --app-version`, writes latest.json for exactly the
#                platforms that were built (macOS only when signed and
#                notarized) and signs it, verifies all of it with the
#                committed public key, uploads it to a DRAFT release in the
#                release repository, checks the uploaded asset list,
#                publishes it as a PRE-RELEASE, downloads every file through
#                its public URL without a token and verifies it again, and
#                only then marks it the latest release, which is what
#                releases/latest/download/latest.json follows. A failure at
#                any point leaves the previous release as the latest.
#
# Secrets and variables (docs/development/release.md#secrets):
#   environment `release`: TAURI_SIGNING_PRIVATE_KEY,
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updates), SOTYWARE_RELEASES_TOKEN
#     (fine-grained token: Contents read and write on the release
#     repository only);
#   repository: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#     APPLE_SIGNING_IDENTITY, APPLE_API_ISSUER, APPLE_API_KEY_ID,
#     APPLE_API_KEY (macOS, optional; repository secrets because a job that
#     calls a reusable workflow cannot name an environment);
#   repository variable SOTYWARE_ALLOW_UNSIGNED_WINDOWS=true while no
#     Authenticode certificate exists.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and verify everything, but create no release"
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, whatever the tag: two runs racing would decide
# which one ends up "latest" by timing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      repository: ${{ steps.repository.outputs.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: The tag and every version agree
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -eu
          [ "$REF_TYPE" = "tag" ] || { echo "::error::run this workflow on a tag (gh workflow run release.yml --ref vX.Y.Z), not on $REF_TYPE $TAG"; exit 1; }
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::tag $TAG is not vX.Y.Z"; exit 1 ;; esac
          v="${TAG#v}"
          echo "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || { echo "::error::$v is not a release version"; exit 1; }
          pkg=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          cargolock=$(awk '/^name = "sotyware"$/{getline; print}' src-tauri/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          for got in "$pkg" "$lock" "$conf" "$cargo" "$cargolock"; do
            [ "$got" = "$v" ] || { echo "::error::version mismatch: tag $v, package.json $pkg, package-lock.json $lock, tauri.conf.json $conf, Cargo.toml $cargo, Cargo.lock $cargolock"; exit 1; }
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # The repository the installed app fetches from is the one compiled
      # in (src-tauri/src/updates.rs); this workflow never names another.
      # GITHUB_TOKEN can read another repository only if it is public, which
      # is what installations need: anonymous access.
      - name: The release repository is separate, public and holds no source code
        id: repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Always fatal: the compiled-in source must not be this repository.
          repo=$(node scripts/update-manifest.mjs release-repository --not "$GITHUB_REPOSITORY")
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "release repository: $repo"
          # Fatal outside a dry run; a dry run can rehearse the builds before
          # the release repository is set up.
          refuse() {
            if [ "$DRY_RUN" = "true" ]; then echo "::warning::$1 (dry run: continuing)"; else echo "::error::$1"; exit 1; fi
          }
          if ! private=$(gh api "repos/$repo" --jq .private 2>/dev/null); then
            refuse "$repo cannot be read without signing in: create it as a PUBLIC repository (docs/development/release.md#the-public-release-repository)"
            exit 0
          fi
          [ "$private" = "false" ] || refuse "$repo is private: installations could not download its releases"
          # A release also carries GitHub's "Source code" archives of the
          # release repository's own files: only a README, a licence and
          # similar notes may be there, never sotyware's source.
          if ! entries=$(gh api "repos/$repo/contents" --jq '.[].name' 2>/dev/null); then
            refuse "$repo has no commit yet: add a README.md (docs/development/release.md#the-public-release-repository)"
            exit 0
          fi
          for e in $entries; do
            case "$e" in
              README.md|README|LICENSE|LICENSE.md|LICENSE.txt|SECURITY.md|.gitattributes|.gitignore|.github) ;;
              *) refuse "$repo holds '$e'; the release repository may hold only README, LICENSE, SECURITY.md and .github, never source code" ;;
            esac
          done

      - name: Outside a dry run, the release may be published
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.repository.outputs.repository }}
          RELEASES_TOKEN: ${{ secrets.SOTYWARE_RELEASES_TOKEN }}
          ALLOW_UNSIGNED_WINDOWS: ${{ vars.SOTYWARE_ALLOW_UNSIGNED_WINDOWS }}
        run: |
          set -eu
          # Only commits that reached main are released.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "::error::$TAG ($GITHUB_SHA) is not on main (compare: $status)"; exit 1 ;;
          esac
          # No Authenticode certificate exists (release.md#signing-not-set-up):
          # publishing unsigned Windows installers must be a decision, not a
          # missing secret going unnoticed.
          [ "${ALLOW_UNSIGNED_WINDOWS:-}" = "true" ] || { echo "::error::the Windows installers are not Authenticode-signed (no certificate is configured). Set the repository variable SOTYWARE_ALLOW_UNSIGNED_WINDOWS to true to publish them unsigned on purpose (docs/development/release.md#secrets)"; exit 1; }
          [ -n "${RELEASES_TOKEN:-}" ] || { echo "::error::the SOTYWARE_RELEASES_TOKEN secret is missing (docs/development/release.md#secrets)"; exit 1; }
          export GH_TOKEN="$RELEASES_TOKEN"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::$REPO already has a release $TAG (perhaps a draft); refusing to change it"
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::$REPO already has a tag $TAG; refusing to release over it"
            exit 1
          fi

      # The committed key must be a real public key (not a test fixture's,
      # not a private key) and a probe signed with the secret must verify
      # with it: a release must never ship a build that cannot verify its
      # own updates.
      - name: The signing secret matches src-tauri/update-key.pub
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          node scripts/update-manifest.mjs check-key > /dev/null
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || { echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is missing (docs/development/release.md#update-signing-key)"; exit 1; }
          probe="$RUNNER_TEMP/probe.txt"
          echo "sotyware release key probe $GITHUB_RUN_ID" > "$probe"
          npx tauri signer sign --app-version "$VERSION" "$probe" > /dev/null
          node scripts/update-manifest.mjs check-signature --pubkey src-tauri/update-key.pub --file "$probe" --version "$VERSION"

  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  windows:
    needs: prepare
    uses: ./.github/workflows/release-build.yml
    with:
      upload: true

  macos:
    needs: prepare
    uses: ./.github/workflows/macos.yml
    with:
      package: true
    # Only the Apple secrets, never the update key or the release token.
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

  linux:
    needs: prepare
    # The oldest supported Ubuntu runner: its glibc is the oldest the
    # binaries need.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf file
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: npm ci
      - name: cargo fetch --locked
        working-directory: src-tauri
        run: cargo fetch --locked
      - run: npm run check:rfd-patch
      - run: npm run check:release-binary
      - name: Build the AppImage, deb and rpm
        run: npm run build:release
      - name: Collect and check the packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          v="$VERSION"
          out="$RUNNER_TEMP/linux-packages"
          mkdir -p "$out"
          b=src-tauri/target/release/bundle
          cp "$b/appimage/sotyware_${v}_amd64.AppImage" "$b/deb/sotyware_${v}_amd64.deb" "$b/rpm/sotyware-${v}-1.x86_64.rpm" "$out/"
          # The deb's binary is the checked one, with no build-machine path.
          mkdir -p "$RUNNER_TEMP/deb" && dpkg-deb -x "$out/sotyware_${v}_amd64.deb" "$RUNNER_TEMP/deb"
          node scripts/check-release-binary.mjs --local-paths "$RUNNER_TEMP/deb/usr/bin/sotyware"
          ls -l "$out" && sha256sum "$out"/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: ${{ runner.temp }}/linux-packages
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, ci, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    # GITHUB_TOKEN only reads this repository (the tag's message); the
    # release repository is written with SOTYWARE_RELEASES_TOKEN.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REPO: ${{ needs.prepare.outputs.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/built

      - name: Choose what this release contains
        id: files
        run: |
          set -eu
          [ -n "$REPO" ] || { echo "::error::no release repository from prepare"; exit 1; }
          in="$RUNNER_TEMP/built"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          v="$VERSION"
          cp "$in/windows-installers/sotyware_${v}_x64-setup.exe" "$in/windows-installers/sotyware_${v}_x64_en-US.msi" "$out/"
          cp "$in/linux-packages/sotyware_${v}_amd64.AppImage" "$in/linux-packages/sotyware_${v}_amd64.deb" "$in/linux-packages/sotyware-${v}-1.x86_64.rpm" "$out/"
          kinds="nsis,msi,appimage,deb,rpm"
          macos="not included: the builds were not signed and notarized (no Apple secrets)"
          if grep -qx 'notarized=true' "$in/macos-aarch64/status.txt" && grep -qx 'notarized=true' "$in/macos-x86_64/status.txt"; then
            cp "$in/macos-aarch64/sotyware_${v}_aarch64.app.tar.gz" "$in/macos-aarch64/sotyware_${v}_aarch64.dmg" "$out/"
            cp "$in/macos-x86_64/sotyware_${v}_x64.app.tar.gz" "$in/macos-x86_64/sotyware_${v}_x64.dmg" "$out/"
            kinds="$kinds,app-aarch64,app-x64"
            macos="included: Apple Silicon and Intel, signed and notarized"
          fi
          echo "kinds=$kinds" >> "$GITHUB_OUTPUT"
          echo "macOS: $macos"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "base=https://github.com/${REPO}/releases/download/${TAG}/" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      # actions/checkout turns an annotated tag into a lightweight one, so
      # its message is read through the API (this repository, read-only).
      # The message is published: it becomes the release notes in the
      # release repository and in the app.
      - name: Release notes from the tag's message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "${ref%% *}" = "tag" ]; then
            # Without a PGP or SSH signature block.
            gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq .message | sed -e '/^-----BEGIN/,$d' > "$notes"
          fi
          [ -n "$(tr -d '[:space:]' < "$notes")" ] || git log -1 --format=%B > "$notes"
          cat "$notes"

      # The only step that sees the update signing key. The Tauri CLI reads
      # it from the environment and never prints it.
      - name: Sign the updater artifacts and latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          KINDS: ${{ steps.files.outputs.kinds }}
          BASE: ${{ steps.files.outputs.base }}
        run: |
          set -eu
          r="$RUNNER_TEMP/release"
          v="$VERSION"
          node scripts/update-manifest.mjs check-key > /dev/null
          args=""
          for kind in $(echo "$KINDS" | tr ',' ' '); do
            case "$kind" in
              nsis) f="sotyware_${v}_x64-setup.exe" ;;
              msi) f="sotyware_${v}_x64_en-US.msi" ;;
              appimage) f="sotyware_${v}_amd64.AppImage" ;;
              deb) f="sotyware_${v}_amd64.deb" ;;
              rpm) f="sotyware-${v}-1.x86_64.rpm" ;;
              app-aarch64) f="sotyware_${v}_aarch64.app.tar.gz" ;;
              app-x64) f="sotyware_${v}_x64.app.tar.gz" ;;
              *) echo "::error::unknown kind $kind"; exit 1 ;;
            esac
            npx tauri signer sign --app-version "$v" "$r/$f" > /dev/null
            args="$args --$kind $r/$f"
          done
          node scripts/update-manifest.mjs create --version "$v" --base-url "$BASE" --pubkey src-tauri/update-key.pub --notes-file "$RUNNER_TEMP/notes.md" --out "$r/latest.json" $args
          npx tauri signer sign --app-version "$v" "$r/latest.json" > /dev/null

      - name: Verify every file with the committed public key alone
        env:
          KINDS: ${{ steps.files.outputs.kinds }}
          BASE: ${{ steps.files.outputs.base }}
        run: |
          set -eu
          r="$RUNNER_TEMP/release"
          node scripts/update-manifest.mjs verify --manifest "$r/latest.json" --pubkey src-tauri/update-key.pub --artifacts "$r" --base-url "$BASE" --require "$KINDS"
          (cd "$r" && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Keep the files (dry run)
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: ${{ runner.temp }}/release
          retention-days: 7

      # A draft is visible only to people with write access to the release
      # repository; nothing is public yet.
      - name: Upload to a draft release in the release repository
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SOTYWARE_RELEASES_TOKEN }}
          MACOS: ${{ steps.files.outputs.macos }}
        run: |
          set -eu
          r="$RUNNER_TEMP/release"
          body="$RUNNER_TEMP/body.md"
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "Windows 11 is the platform this release is validated on. The Linux packages are provided for testing and have not been validated on a real desktop. macOS: $MACOS."
            echo
            echo "Every package and latest.json carry a minisign signature of sotyware's release key; SHA256SUMS lists their hashes. The source code is not published here."
          } > "$body"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::$REPO already has a release $TAG; refusing to change it"
            exit 1
          fi
          # The tag is created in the release repository, on its default
          # branch, when the draft is published; the source commit is named
          # only in the notes' text, if at all.
          gh release create "$TAG" --repo "$REPO" --draft --title "sotyware $VERSION" --notes-file "$body" "$r"/*

      - name: Check the draft holds exactly these files
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SOTYWARE_RELEASES_TOKEN }}
        run: |
          set -eu
          r="$RUNNER_TEMP/release"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort > "$RUNNER_TEMP/uploaded.txt"
          (cd "$r" && for f in *; do echo "$f $(stat -c %s "$f")"; done) | sort > "$RUNNER_TEMP/local.txt"
          diff "$RUNNER_TEMP/local.txt" "$RUNNER_TEMP/uploaded.txt"

      - name: Publish as a pre-release (not yet the latest)
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SOTYWARE_RELEASES_TOKEN }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --latest=false

      # Through the public download URLs, as an installation fetches them:
      # no token, HTTPS only.
      - name: Verify the published files as installations see them
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          KINDS: ${{ steps.files.outputs.kinds }}
          BASE: ${{ steps.files.outputs.base }}
        run: |
          set -eu
          d="$RUNNER_TEMP/downloaded"
          mkdir -p "$d"
          for f in $(cd "$RUNNER_TEMP/release" && ls); do
            curl -fsSL --retry 5 --retry-delay 5 --proto '=https' --proto-redir '=https' -o "$d/$f" "$BASE$f"
          done
          node scripts/update-manifest.mjs verify --manifest "$d/latest.json" --pubkey src-tauri/update-key.pub --artifacts "$d" --base-url "$BASE" --require "$KINDS"
          (cd "$d" && sha256sum -c SHA256SUMS)

      - name: Make it the latest release
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SOTYWARE_RELEASES_TOKEN }}
        run: gh release edit "$TAG" --repo "$REPO" --prerelease=false --latest

      - name: The update endpoint now serves this release
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          set -eu
          for i in 1 2 3 4 5 6; do
            curl -fsSL --proto '=https' --proto-redir '=https' -o "$RUNNER_TEMP/served.json" "https://github.com/${REPO}/releases/latest/download/latest.json" || true
            if cmp -s "$RUNNER_TEMP/served.json" "$RUNNER_TEMP/release/latest.json"; then
              echo "https://github.com/${REPO}/releases/latest/download/latest.json is the manifest of $TAG"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://github.com/${REPO}/releases/latest/download/latest.json does not serve this release's manifest"
          exit 1
