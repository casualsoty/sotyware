# Publishes a sotyware release on GitHub Releases of THIS repository, where
# installations look for updates (ADR-036, ADR-039,
# docs/development/release.md#publishing-a-release):
#
#   https://github.com/casualsoty/sotyware/releases/latest/download/latest.json
#
#   git tag -s v0.2.0 -m "sotyware 0.2.0" -m "<release notes>" && git push origin v0.2.0
#
# Started by hand it is a DRY RUN unless `dry_run` is unticked:
#   gh workflow run release.yml --ref main          (rehearsal, no tag needed)
#   gh workflow run release.yml --ref v0.2.0 -f dry_run=false   (a real release
#                                                    of an existing tag)
# A dry run builds and tests every platform, signs the updater packages and
# latest.json with a THROWAWAY key made for that run, verifies everything and
# keeps the files as the `release-dry-run` artifact. It never uses the
# release key or the `release` environment and publishes nothing.
#
# Order, and what stops it:
#  1. prepare  - every version (package.json, package-lock.json, Cargo.toml,
#                Cargo.lock, tauri.conf.json) is the same and, on a tag,
#                equals vX.Y.Z; the repository compiled into the app
#                (src-tauri/src/updates.rs) is this one. For a real release
#                also: run on a tag whose commit is on main; no release of
#                that tag exists; src-tauri/update-key.pub holds a real public
#                key (not a test fixture's, not a private key); the `release`
#                environment exists and admits only tags; the signing key and
#                the Apple credentials are not repository secrets; unsigned
#                Windows installers were explicitly allowed. A dry run only
#                warns about these.
#  2. ci       - ci.yml on the same commit (Linux, Windows, account service).
#  3. builds   - Windows (release-build.yml: MSI + NSIS, unpacked and
#                checked), Linux (AppImage, deb, rpm on Ubuntu 22.04), macOS
#                (macos.yml: the tests natively on Apple Silicon and on Intel,
#                and the .app/.dmg, signed and notarized only with the Apple
#                credentials of its `macos-signing` environment).
#  4. publish  - real releases only. Environment `release`: the only job that
#                can read the update signing key, and only once that
#                environment's protection rules (tags only; a reviewer, if
#                configured) let it start. Checks the tag still names the
#                built commit and the key matches update-key.pub, signs and
#                verifies everything (scripts/release-assemble.sh), uploads a
#                DRAFT (visible to maintainers only), compares the uploaded
#                files and downloads them back with the token, publishes it as
#                a PRE-RELEASE (public, make_latest=false), downloads every
#                file anonymously over HTTPS, compares it with what was signed
#                and verifies it again with the committed public key, and
#                only then makes it the LATEST release (prerelease=false,
#                make_latest=true), which releases/latest/download/latest.json
#                follows; the last step checks that URL serves this
#                manifest and signature.
#                A failed or cancelled run deletes the draft it created while
#                that is still a draft (never one found before, never a
#                published release). A failure before the promotion leaves
#                the previous release as the latest; only the last check
#                runs after it, on a release that passed every check.
#     rehearse - dry runs only, no environment: the same signing and checks
#                with a throwaway key; uploads the files as an artifact.
#
# Tokens, secrets and variables (docs/development/release.md#secrets):
#   GITHUB_TOKEN: read-only everywhere except the publish job
#     (`contents: write`: create, upload, publish the release). No other
#     token is needed.
#   environment `release`: TAURI_SIGNING_PRIVATE_KEY,
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#   environment `macos-signing` (used by macos.yml's package job): the six
#     APPLE_* secrets, optional.
#   repository variable SOTYWARE_ALLOW_UNSIGNED_WINDOWS=true while no
#     Authenticode certificate exists.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse with a throwaway key and publish nothing (untick only on a tag, to release it)"
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, whatever the tag: two runs racing would decide
# which one ends up "latest" by timing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads only: the repository, its releases and the `release`
    # environment's protection settings (public on a public repository).
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dry-run: ${{ steps.version.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node only runs the repository's own scripts here (standard library
      # only): no dependency is installed in this job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: The tag and every version agree
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          pkg=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          cargolock=$(awk '/^name = "sotyware"$/{getline; print}' src-tauri/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          for got in "$lock" "$conf" "$cargo" "$cargolock"; do
            [ "$got" = "$pkg" ] || { echo "::error::version mismatch: package.json $pkg, package-lock.json $lock, tauri.conf.json $conf, Cargo.toml $cargo, Cargo.lock $cargolock"; exit 1; }
          done
          echo "$pkg" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || { echo "::error::$pkg is not a release version (X.Y.Z)"; exit 1; }
          if [ "$REF_TYPE" = "tag" ]; then
            [ "$REF_NAME" = "v$pkg" ] || { echo "::error::tag $REF_NAME does not match the version $pkg (expected v$pkg)"; exit 1; }
          elif [ "$DRY_RUN" != "true" ]; then
            echo "::error::a release runs on its tag (git push origin v$pkg, or gh workflow run release.yml --ref v$pkg -f dry_run=false), not on $REF_TYPE $REF_NAME"
            exit 1
          else
            echo "::notice::dry run on $REF_TYPE $REF_NAME: the files are named and addressed as v$pkg would be"
          fi
          {
            echo "version=$pkg"
            echo "tag=v$pkg"
            echo "dry-run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

      # A real release must pass these; a dry run reports them as warnings,
      # so the builds can be rehearsed before the key, the environment or
      # the tag exist.
      - name: The release may be published from here
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ALLOW_UNSIGNED_WINDOWS: ${{ vars.SOTYWARE_ALLOW_UNSIGNED_WINDOWS }}
          # Whether these are readable WITHOUT an environment, i.e. stored as
          # repository (or organisation) secrets that every workflow run of
          # this repository could read. Only the comparison is evaluated.
          KEY_IN_REPOSITORY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          APPLE_IN_REPOSITORY: ${{ secrets.APPLE_CERTIFICATE != '' || secrets.APPLE_CERTIFICATE_PASSWORD != '' || secrets.APPLE_SIGNING_IDENTITY != '' || secrets.APPLE_API_ISSUER != '' || secrets.APPLE_API_KEY_ID != '' || secrets.APPLE_API_KEY != '' }}
        run: |
          set -eu
          failed=0
          refuse() {
            if [ "$DRY_RUN" = "true" ]; then echo "::warning::$1 (dry run: continuing)"; else echo "::error::$1"; failed=1; fi
          }
          # A public API path: with the job's token, else anonymously (the
          # repository is public). Prints the body only of a success.
          api() {
            local body
            if body=$(gh api "$1" 2>/dev/null); then printf '%s\n' "$body"; return 0; fi
            curl -fsS --proto '=https' -H 'Accept: application/vnd.github+json' "https://api.github.com/$1" 2>/dev/null
          }

          # Installations read the releases of the repository compiled into
          # them; publishing anywhere else would reach none of them.
          node scripts/update-manifest.mjs release-repository --expect "$GITHUB_REPOSITORY" > /dev/null || refuse "src-tauri/src/updates.rs names another repository than $GITHUB_REPOSITORY"

          # The committed public key is the trust root of every build.
          if ! node scripts/update-manifest.mjs check-key > /dev/null; then
            refuse "src-tauri/update-key.pub holds no usable release key (docs/development/release.md#update-signing-key)"
          fi

          [ "$KEY_IN_REPOSITORY" = "false" ] || refuse "TAURI_SIGNING_PRIVATE_KEY or its password is a repository or organisation secret, readable by every workflow run here: delete it there and store it only in the release environment (docs/development/release.md#secrets)"
          [ "$APPLE_IN_REPOSITORY" = "false" ] || refuse "an APPLE_* secret is a repository or organisation secret: store the Apple credentials only in the macos-signing environment (docs/development/release.md#secrets)"

          # The environment that holds the signing key must exist (GitHub
          # would otherwise create it, unprotected, when publish names it)
          # and admit tags only, so no branch's workflow can read the key.
          if ! envjson=$(api "repos/$GITHUB_REPOSITORY/environments/release"); then
            refuse "the release environment does not exist (docs/development/release.md#secrets)"
          else
            policy=$(echo "$envjson" | jq -r 'if .deployment_branch_policy == null then "every branch and tag" elif .deployment_branch_policy.custom_branch_policies then "custom" else "protected branches" end')
            if [ "$policy" != "custom" ]; then
              refuse "the release environment admits $policy: set Deployment branches and tags to selected tags (v*) only"
            else
              rules=$(api "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies" | jq -r '.branch_policies[] | "\(.type) \(.name)"') || rules=""
              echo "release environment admits: ${rules:-nothing readable}"
              if [ "$rules" != "tag v*" ]; then
                refuse "the release environment must admit exactly one rule, the tag pattern v* (no branch rule)"
              fi
            fi
            echo "$envjson" | jq -e '[.protection_rules[]? | select(.type == "required_reviewers")] | length > 0' > /dev/null \
              || echo "::warning::the release environment has no required reviewer: a pushed tag reaches the signing key without anyone approving it"
            echo "$envjson" | jq -e '.can_admins_bypass == false' > /dev/null \
              || echo "::warning::the release environment lets administrators bypass its protection rules: untick Allow administrators to bypass configured protection rules (docs/development/release.md#secrets)"
          fi
          # The Apple credentials' environment: the branch main (dry runs)
          # and the tag v* (releases), nothing else. Only warned about:
          # without signed and notarized builds macOS stays out of a release.
          if macjson=$(api "repos/$GITHUB_REPOSITORY/environments/macos-signing"); then
            macrules=$(echo "$macjson" | jq -r 'if .deployment_branch_policy == null then "every branch and tag" elif .deployment_branch_policy.custom_branch_policies then "custom" else "protected branches" end')
            if [ "$macrules" = "custom" ]; then
              macrules=$(api "repos/$GITHUB_REPOSITORY/environments/macos-signing/deployment-branch-policies" | jq -r '.branch_policies[] | "\(.type) \(.name)"' | sort | paste -sd, -) || macrules=""
            fi
            echo "macos-signing environment admits: ${macrules:-nothing readable}"
            [ "$macrules" = "branch main,tag v*" ] \
              || echo "::warning::the macos-signing environment must admit only the branch main and the tag v*: restrict it before storing Apple credentials there (docs/development/release.md#secrets)"
          else
            echo "::notice::the macos-signing environment does not exist: the macOS package job will create it without protection; restrict it before storing Apple credentials there (docs/development/release.md#secrets)"
          fi

          if [ "$DRY_RUN" != "true" ]; then
            # Only commits that reached main are released.
            status=$(api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" | jq -r .status) || status="unknown"
            case "$status" in
              identical|behind) ;;
              *) refuse "$TAG ($GITHUB_SHA) is not on main (compare: $status)" ;;
            esac
            # A published release of this tag (drafts are checked again by
            # the publish job, whose token can see them).
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              refuse "a release $TAG already exists; never re-publish a version (docs/development/release.md#publishing-a-release)"
            fi
          fi
          # No Authenticode certificate exists (release.md#signing-not-set-up):
          # publishing unsigned Windows installers must be a decision, not a
          # missing secret going unnoticed.
          [ "${ALLOW_UNSIGNED_WINDOWS:-}" = "true" ] || refuse "the Windows installers are not Authenticode-signed: set the repository variable SOTYWARE_ALLOW_UNSIGNED_WINDOWS to true to publish them unsigned on purpose (docs/development/release.md#secrets)"
          exit "$failed"

  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  windows:
    needs: prepare
    uses: ./.github/workflows/release-build.yml
    with:
      upload: true

  # No secrets passed: macos.yml's package job reads the Apple credentials
  # from its own `macos-signing` environment, never the update key.
  macos:
    needs: prepare
    uses: ./.github/workflows/macos.yml
    with:
      package: true

  linux:
    needs: prepare
    # The oldest Ubuntu runner: its glibc (2.35) is the oldest the binaries
    # need. Deprecated by GitHub since 2026-09-17, brownouts from
    # 2027-03-23, removed 2027-04-17; moving to ubuntu-24.04 raises that
    # floor to glibc 2.39 (docs/development/release.md#building-a-release).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf file
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: npm ci
      - name: cargo fetch --locked
        working-directory: src-tauri
        run: cargo fetch --locked
      - run: npm run check:rfd-patch
      - run: npm run check:release-binary
      - name: Build the AppImage, deb and rpm
        run: npm run build:release
      - name: Collect and check the packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          v="$VERSION"
          out="$RUNNER_TEMP/linux-packages"
          mkdir -p "$out"
          b=src-tauri/target/release/bundle
          cp "$b/appimage/sotyware_${v}_amd64.AppImage" "$b/deb/sotyware_${v}_amd64.deb" "$b/rpm/sotyware-${v}-1.x86_64.rpm" "$out/"
          # The deb's binary is the checked one, with no build-machine path.
          mkdir -p "$RUNNER_TEMP/deb" && dpkg-deb -x "$out/sotyware_${v}_amd64.deb" "$RUNNER_TEMP/deb"
          node scripts/check-release-binary.mjs --local-paths "$RUNNER_TEMP/deb/usr/bin/sotyware"
          ls -l "$out" && sha256sum "$out"/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: ${{ runner.temp }}/linux-packages
          if-no-files-found: error
          retention-days: 7

  # Dry runs: everything publish does before uploading, with a throwaway key
  # made here and deleted with the runner. Its files are not release
  # material: nothing trusts that key.
  rehearse:
    needs: [prepare, ci, windows, macos, linux]
    if: ${{ needs.prepare.outputs.dry-run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The Tauri CLI (signing) and nothing else is needed: no install
      # script of any dependency runs.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/built

      - name: Release notes (the tag's message, else the commit's)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null) && [ "${ref%% *}" = "tag" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq .message | sed -e '/^-----BEGIN/,$d' > "$notes"
          fi
          [ -n "$(tr -d '[:space:]' < "$notes")" ] || git log -1 --format=%B > "$notes"
          cat "$notes"

      - name: Sign with a throwaway key and verify (scripts/release-assemble.sh)
        env:
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          set -eu
          k="$RUNNER_TEMP/rehearsal-key"
          mkdir -p "$k"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          npx --no-install tauri signer generate --ci -p "$password" -w "$k/update.key" > /dev/null
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$password"
          TAURI_SIGNING_PRIVATE_KEY=$(cat "$k/update.key")
          echo "::add-mask::$TAURI_SIGNING_PRIVATE_KEY"
          export TAURI_SIGNING_PRIVATE_KEY
          PUBKEY="$k/update.key.pub" bash scripts/release-assemble.sh "$RUNNER_TEMP/built" "$RUNNER_TEMP/release"
          cp "$k/update.key.pub" "$RUNNER_TEMP/release/REHEARSAL-KEY-NOT-TRUSTED.pub"
          rm -rf "$k"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, ci, windows, macos, linux]
    if: ${{ needs.prepare.outputs.dry-run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The update signing key lives only here. The job starts once the
    # environment's protection rules pass (tags only; a reviewer's
    # approval, if configured); until then it cannot read the key.
    environment: release
    permissions:
      contents: write # create, upload to and publish this repository's release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/
    # GH_TOKEN (this job's write token) is given to the steps that call the
    # API, never to the signing step or the anonymous downloads.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in the job that holds the key.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The Tauri CLI (signing) and nothing else is needed: no install
      # script of any dependency runs where the key will be.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/built

      # The tag must still name the commit every job built: a tag moved
      # during the run would put this release on other code.
      - name: The tag, the release and the key, before anything is signed
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_UNSIGNED_WINDOWS: ${{ vars.SOTYWARE_ALLOW_UNSIGNED_WINDOWS }}
        run: |
          set -eu
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          sha=${ref#* }
          [ "${ref%% *}" = "tag" ] && sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::$TAG now names $sha, but this run built $GITHUB_SHA"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::a release $TAG already exists (perhaps a draft); refusing to change it"
            exit 1
          fi
          [ "${ALLOW_UNSIGNED_WINDOWS:-}" = "true" ] || { echo "::error::SOTYWARE_ALLOW_UNSIGNED_WINDOWS is not true"; exit 1; }
          node scripts/update-manifest.mjs release-repository --expect "$GITHUB_REPOSITORY"
          node scripts/update-manifest.mjs check-key > /dev/null

      # actions/checkout turns an annotated tag into a lightweight one, so
      # its message is read through the API. It becomes the published
      # release notes and the notes the app shows.
      - name: Release notes from the tag's message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "${ref%% *}" = "tag" ]; then
            # Without a PGP or SSH signature block.
            gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq .message | sed -e '/^-----BEGIN/,$d' > "$notes"
          fi
          [ -n "$(tr -d '[:space:]' < "$notes")" ] || git log -1 --format=%B > "$notes"
          cat "$notes"

      # The only step that sees the update signing key. The Tauri CLI reads
      # it from the environment and never prints it; the script removes it
      # from its environment before verifying.
      - name: Sign with the release key and verify (scripts/release-assemble.sh)
        id: files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBKEY: src-tauri/update-key.pub
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          set -eu
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || { echo "::error::the release environment has no TAURI_SIGNING_PRIVATE_KEY (docs/development/release.md#update-signing-key)"; exit 1; }
          # A probe first, for a clear message if the secret is not the
          # private half of the committed key.
          probe="$RUNNER_TEMP/probe.txt"
          echo "sotyware release key probe $GITHUB_RUN_ID" > "$probe"
          npx --no-install tauri signer sign --app-version "$VERSION" "$probe" > /dev/null
          node scripts/update-manifest.mjs check-signature --pubkey "$PUBKEY" --file "$probe" --version "$VERSION" \
            || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not the private half of src-tauri/update-key.pub"; exit 1; }
          bash scripts/release-assemble.sh "$RUNNER_TEMP/built" "$RUNNER_TEMP/release"

      # A draft is visible only to people with write access; nothing is
      # public yet. --verify-tag: the release goes on the pushed tag, never
      # on a tag GitHub would create.
      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS: ${{ steps.files.outputs.macos }}
        run: |
          set -eu
          r="$RUNNER_TEMP/release"
          body="$RUNNER_TEMP/body.md"
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "Windows 11 is the platform this release is validated on. The Linux packages are provided for testing and have not been validated on a real desktop. macOS: $MACOS."
            echo
            echo "Every updater package and latest.json carry a minisign signature of sotyware's release key; SHA256SUMS lists the files' hashes."
          } > "$body"
          # From here on a draft may exist that this run made (the cleanup
          # below removes only such a draft, never one found before).
          touch "$RUNNER_TEMP/draft-created-by-this-run"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "sotyware $VERSION" --notes-file "$body" "$r"/*

      - name: The draft holds exactly these files, byte for byte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          r="$RUNNER_TEMP/release"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort > "$RUNNER_TEMP/uploaded.txt"
          (cd "$r" && for f in *; do echo "$f $(stat -c %s "$f")"; done) | sort > "$RUNNER_TEMP/local.txt"
          diff "$RUNNER_TEMP/local.txt" "$RUNNER_TEMP/uploaded.txt"
          d="$RUNNER_TEMP/draft"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$d"
          cmp "$d/SHA256SUMS" "$r/SHA256SUMS"
          (cd "$d" && sha256sum -c SHA256SUMS)

      - name: Publish as a pre-release (public, not the latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          sha=${ref#* }
          [ "${ref%% *}" = "tag" ] && sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::$TAG now names $sha, but this run built $GITHUB_SHA"; exit 1; }
          # GitHub never makes a pre-release the latest release; make_latest
          # defaults to true for a newly published release, so it is sent as
          # false as well.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

      # Through the public download URLs, as an installation fetches them:
      # no token, HTTPS only. A just-published file can answer 404 for a
      # moment, hence the retries on every error. Each file must be the one
      # signed above, byte for byte, and verify on its own.
      - name: Verify the published files as installations see them
        env:
          KINDS: ${{ steps.files.outputs.kinds }}
        run: |
          set -eu
          d="$RUNNER_TEMP/downloaded"
          mkdir -p "$d"
          for f in $(cd "$RUNNER_TEMP/release" && ls); do
            curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors --proto '=https' --proto-redir '=https' -o "$d/$f" "$BASE$f"
            cmp "$d/$f" "$RUNNER_TEMP/release/$f"
          done
          node scripts/update-manifest.mjs verify --manifest "$d/latest.json" --pubkey src-tauri/update-key.pub --artifacts "$d" --base-url "$BASE" --require "$KINDS"
          (cd "$d" && sha256sum -c SHA256SUMS)

      # The promotion: prerelease=false and make_latest=true in one request.
      # Then GitHub's own answer for the latest release must be this one.
      - name: Make it the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          for _ in 1 2 3 4 5 6; do
            got=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '"\(.tag_name) draft=\(.draft) prerelease=\(.prerelease)"' 2>/dev/null) || got="no latest release"
            if [ "$got" = "$TAG draft=false prerelease=false" ]; then
              echo "the latest release is $got"
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub's latest release is $got, not $TAG"
          exit 1

      # What installations fetch: latest.json and latest.json.sig through
      # the "latest" URL, the very files signed above, verifying together.
      - name: The update endpoint now serves this release
        env:
          KINDS: ${{ steps.files.outputs.kinds }}
        run: |
          set -eu
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          s="$RUNNER_TEMP/served"
          mkdir -p "$s"
          for _ in 1 2 3 4 5 6; do
            rm -f "$s/latest.json" "$s/latest.json.sig"
            curl -fsSL --proto '=https' --proto-redir '=https' -o "$s/latest.json" "$url" || true
            curl -fsSL --proto '=https' --proto-redir '=https' -o "$s/latest.json.sig" "$url.sig" || true
            if cmp -s "$s/latest.json" "$RUNNER_TEMP/release/latest.json" && cmp -s "$s/latest.json.sig" "$RUNNER_TEMP/release/latest.json.sig"; then
              node scripts/update-manifest.mjs verify --manifest "$s/latest.json" --sig "$s/latest.json.sig" --pubkey src-tauri/update-key.pub --base-url "$BASE" --require "$KINDS"
              echo "$url and its .sig are the signed manifest of $TAG"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url (or its .sig) does not serve this release's manifest"
          exit 1

      # Runs after every step, also when the run was cancelled or timed out,
      # and acts only when the job did not succeed. Only an unpublished
      # draft that this run created is removed: it is invisible to users and
      # would block re-running the failed jobs. A draft that existed before
      # the run, and a published release, are left for the maintainer
      # (release.md#publishing-a-release).
      - name: Remove this run's draft after a failure or cancellation
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          [ "$JOB_STATUS" != "success" ] || exit 0
          [ -e "$RUNNER_TEMP/draft-created-by-this-run" ] || exit 0
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease)"' 2>/dev/null) || state="none"
          case "$state" in
            "draft=true "*)
              if gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes; then
                echo "::warning::the draft $TAG was deleted; the tag stays"
              else
                echo "::error::the draft $TAG could not be deleted: delete it by hand before re-running (docs/development/release.md#publishing-a-release)"
                exit 1
              fi
              ;;
            "draft=false prerelease=true")
              echo "::error::$TAG stays a public pre-release that did not pass every check; it is not the latest release. Delete it and release a new patch version (docs/development/release.md#publishing-a-release)"
              ;;
            "draft=false prerelease=false")
              echo "::warning::$TAG passed every check and was made the latest release; only a later check failed (docs/development/release.md#publishing-a-release)"
              ;;
            *)
              echo "no release $TAG to clean up ($state)"
              ;;
          esac
