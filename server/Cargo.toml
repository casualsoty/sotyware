[package]
name = "sotyware-server"
version = "0.1.0"
description = "sotyware account and end-to-end encrypted sync service (ADR-032)"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "backup"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
getrandom = "0.3"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls", "ring", "rustls-native-certs"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
